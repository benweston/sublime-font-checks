# ==============================================================================
# SAMPLE: Kubernetes Manifests (sublime-font-checks)
# Purpose: Visual check for YAML hierarchy, indentation guides, anchors, scalars
# ==============================================================================
# TODO: Inspect indentation guide alignment, dash bullet alignment (- ), and colons
# FIXME: Test multi-line block scalar styling (| vs > vs |-) and string escaping
# NOTE: Check YAML anchors (&ref) and alias dereferences (*ref) syntax coloring
# ==============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: platform-observability
  labels:
    environment: production
    istio-injection: enabled
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/part-of: core-infrastructure
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: "tier=frontend,zone=primary"
    description: "Namespace for core telemetry, metrics, and font validation apps"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-v2
  namespace: platform-observability
  labels:
    app: font-checker-service
    tier: api
data:
  # Simple key-values: booleans, integers, strings
  APP_ENV: "production"
  PORT: "8080"
  METRICS_ENABLED: "true"
  SAMPLING_RATE: "0.05"
  LOG_LEVEL: "debug"
  SENTINEL_NULL: null

  # Literal block scalar with strip chomping (|-)
  server.properties: |-
    # Embedded INI / Java Properties format
    server.port = 8080
    server.compression.enabled = true
    server.compression.mime-types = text/html,text/xml,text/plain,application/json
    management.endpoints.web.exposure.include = health,metrics,prometheus
    management.endpoint.health.show-details = always

  # Literal block scalar (|) keeping trailing newlines
  ui-banner.txt: |
    ================================================================
    * SUBLIME TEXT TYPOGRAPHY BENCHMARK
    * Ligatures: == != >= <= => -> <- := :: && || <!-- -->
    * Glyphs: 0 vs O | 1 vs l vs I vs | | ` vs ' vs "
    ================================================================

  # Folded block scalar (>) converting newlines to single spaces
  description.md: >
    This application validates font metrics, subpixel anti-aliasing,
    and token contrast across modern display resolutions including
    4K HiDPI and ultra-wide aspect ratios.

  # Embedded JSON configuration payload
  runtime.json: |
    {
      "version": "1.4.0",
      "thresholds": {
        "cpu_percent": 85.5,
        "memory_mb": 1024,
        "max_connections": 50000
      },
      "features": ["http3", "quic", "brotli", "zstd"],
      "debug": false
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: platform-observability
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app_user:V3ry$Tr0ng&C0mpl3x!P@ss@postgres.internal:5432/telemetry"
  API_KEY: "sk_live_51Mz0O1lI98BbS5qpdg9"
  HMAC_SALT: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: font-checker-service
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: font-checker
    app.kubernetes.io/instance: font-checker-prod
    app.kubernetes.io/version: "1.24.8"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: font-checker-service
  template:
    metadata:
      labels:
        app: font-checker-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9090"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - font-checker-service
                topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-database-check
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Checking database connectivity..."
              until nc -z -v -w3 postgres.internal 5432; do
                echo "Waiting for postgresql..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"
            requests:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: app
          image: ghcr.io/sublime-font-checks/service:v1.24.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config-v2
                  key: APP_ENV
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: API_KEY
          # YAML Anchor Definition (&standard-resources)
          resources: &standard-resources
            limits:
              cpu: "1000m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
              readOnly: true
            - name: tmp-scratch
              mountPath: /tmp
        # Sidecar container dereferencing the YAML anchor (*standard-resources)
        - name: log-exporter
          image: fluent/fluent-bit:2.2.2
          resources: *standard-resources
          volumeMounts:
            - name: tmp-scratch
              mountPath: /tmp
      volumes:
        - name: config-volume
          configMap:
            name: app-config-v2
            items:
              - key: server.properties
                path: server.properties
              - key: runtime.json
                path: runtime.json
        - name: tmp-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: font-checker-service
  namespace: platform-observability
  labels:
    app: font-checker-service
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: font-checker-service
  ports:
    - name: http
      port: 80
      targetPort: http-api
      protocol: TCP
    - name: telemetry
      port: 9090
      targetPort: metrics
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: font-checker-ingress
  namespace: platform-observability
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
    - hosts:
        - "fonts.company.internal"
        - "telemetry.company.internal"
      secretName: font-checker-tls-cert
  rules:
    - host: "fonts.company.internal"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: font-checker-service
                port:
                  number: 80
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: font-checker-service
                port:
                  number: 9090
